# Copy .env.example to .env and set LIBRARY_HOST_PATH before running:
#   docker compose up -d
# Uses the image published from this repo's main branch. To update, pull the
# new image (docker compose pull, or the Update button in Dockge) and restart.
# To run your local checkout instead: docker compose up -d --build
services:
  zim-forge:
    image: ghcr.io/rastrumquill/zim-forge:latest
    build: .
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/data
      # Lets ZIM Forge check free space, verify the ZIM files it produces and
      # clean up temp folders left by failed crawls.
      - ${LIBRARY_HOST_PATH}:/library
      # Where "File mirror" jobs store downloads. Keep it outside the library.
      - ${MIRROR_HOST_PATH}:/mirrors:ro
    environment:
      LIBRARY_HOST_PATH: ${LIBRARY_HOST_PATH}
      LIBRARY_PATH: /library
      MIRROR_HOST_PATH: ${MIRROR_HOST_PATH}
      MIRROR_PATH: /mirrors
      KIWIX_CONTAINER: ${KIWIX_CONTAINER:-}
      ZIMFORGE_PASSWORD: ${ZIMFORGE_PASSWORD:-}
      SCRAPER_MEMORY: ${SCRAPER_MEMORY:-}
      SCRAPER_CPUS: ${SCRAPER_CPUS:-}
    restart: unless-stopped
